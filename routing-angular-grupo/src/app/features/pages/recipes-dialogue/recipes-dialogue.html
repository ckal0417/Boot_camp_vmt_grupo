<h2 mat-dialog-title>
  Delete Recipe
</h2>

<mat-dialog-content>
  <p>
    ¿Estás seguro de eliminar esta receta?
    <br>
    <strong>
      {{ data.name }}
    </strong>
  </p>
</mat-dialog-content>

<mat-dialog-actions align="center">

  <button

    mat-flat-button
    (click)="cancel()">Cancel

  </button>

  <button
  
    mat-raised-button
    color="warn"
    (click)="confirm()"> Delete

  </button>

</mat-dialog-actions>
